<!DOCTYPE html>
<html lang='zh-Hant-TW'>
<head>
<meta charset='UTF-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<!--控制手機顯示比例固定+禁止縮放-->
<meta name='viewport' content='width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no' />
<meta name='format-detection' content='telephone=no'>
<!-- css start -->
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
<link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #fff;
  }
  section {
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
  }
  img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
<style>
  .ch_slider {
    width: 100%;
    margin: 0 auto;
    background-color: #60bcff;
    padding-bottom: 60px;
  }
  .ch_slider .slick-dotted.slick-slider {
    margin-bottom: 0;
  }
  .ch_slider .slick-dots {
    bottom: 40px;
  }
  .ch_slider .card {
    position: relative;
    width: 100%;
    height: auto;
  }
  .ch_slider .gif {
    position: absolute;
    top: 29.5%;
    left: 14%;
    width: 72%;
  }
  .ch_slider img {
    width: 100%;
    height: auto;
    display: block;
  }
  .ch_slider .slick-dots li {
    position: relative;
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 5px;
    padding: 0;
    cursor: pointer;
  }
  .ch_slider .slick-dots li button {
    font-size: 0;
    line-height: 0;
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 8px;
    padding: 0;
    cursor: pointer;
    color: transparent;
    border: 0;
    outline: none;
    background: #FFF;
    opacity: 0.5;
  }
  .ch_slider .slick-dots li button:before {
    display: none;
  }
  .ch_slider .slick-dots li.slick-active button {
    opacity: 1;
  }
</style>
<!-- css end -->
</head>
<body>
<!-- html start -->
<!-- 圖片src請改為絕對路徑如hhttps://files.sat.cool/public/tinymce/ajktJpf4ZjinYUPBuvJjAOMkppCxYunplW31zmYb.jpg -->
<div class="ch_slider">
  <div class="card">
    <img src="https://assets.backme.tw/uploads/ckeditor/pictures/115420/content_0727new_c1-2a-v2.png" class="bg">
    <img src="https://assets.backme.tw/uploads/ckeditor/pictures/115418/content_0727new_c1-2a.gif" class="gif">
  </div>
  <div class="card">
    <img src="0727/0727new_c1-2b-v2.png" class="bg">
    <img src="https://assets.backme.tw/uploads/ckeditor/pictures/115419/content_0727new_c1-2b.gif" class="gif">
  </div>
  <div class="card">
    <img src="0727/0727new_c1-2c-v2.png" class="bg">
    <img src="https://assets.backme.tw/uploads/ckeditor/pictures/115417/content_0727new_c1-2c.gif" class="gif">
  </div>
</div>
<!-- html end -->
<!-- jquery start -->
<script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
<!-- slick -->
<script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script>
  $(document).ready(function(){
    $('.ch_slider').slick({
      dots: true,
      infinite: true,
      speed: 900,
      slidesToShow: 1,
      slidesToScroll: 1,
      centerMode: true,
      arrows: false,
      autoplay: true,
      autoplaySpeed: 3000
    });
    function sendHeightToParent() {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );

      window.parent.postMessage(
        {
          type: 'iframeResize',
          height: height
        },
        'https://wabay.tw/'
      );
    }

    window.addEventListener('load', sendHeightToParent);
    window.addEventListener('resize', sendHeightToParent);

    const observer = new ResizeObserver(sendHeightToParent);

    observer.observe(document.body);
    observer.observe(document.documentElement);
  });
</script>
<!-- jquery end -->
</body>
</html>

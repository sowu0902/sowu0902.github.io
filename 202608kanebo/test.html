<!DOCTYPE html>
<html lang='zh-Hant-TW'>
<head>
<meta charset='UTF-8'>
<!-- title字數大約15~20個中文字 -->
<title>15~20個中文字</title>
<meta property='og:title' content='15~20個中文字'>
<meta property='og:site_name' content='15~20個中文字'/>
<!-- keywords最多不要超過5個，字數最好在2~8個字內 -->
<meta name='keywords' content='天下雜誌,CWLAB'>
<!-- description字數在75 ~ 155個中文字內 -->
<meta name='description' content='75 ~ 155個中文字'>
<meta property='og:description' content='75 ~ 155個中文字'>
<link rel='canonical' href='https://event.cw.com.tw/XXX/'>
<meta property='og:url' content='https://event.cw.com.tw/XXX/'/>
<!-- 抓大圖 -->
<meta property='og:image' content='https://event.cw.com.tw/XXX/assets/images/fbimg.jpg'/>
<meta property='og:type' content='article'>
<meta property='og:image:width' content='1200'>
<meta property='og:image:height' content='628'>
<meta content='zh_TW' property='og:locale'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<!-- Favicon -->
<link rel='shortcut icon' href='https://csr.cw.com.tw/assets/images/favicon.ico' type='image/x-icon'/>
<!--控制手機顯示比例固定+禁止縮放-->
<meta name='viewport' content='width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no' />
<meta name='format-detection' content='telephone=no'>
<style>
  .content-5 {
    /* background-color: gray; */
    background-image: url(../images/info/block5_bg.jpg);
    background-repeat: no-repeat;
    background-size: 100%;
    background-position: center bottom;
    padding-top: 100px;
    padding-bottom: 500px;
  }
  .title-wrap {
    position: relative;
    width: 433px;
    height: 60px;
    
  }
  .text h3 {
    width:433px;
    height: 60px;
    margin: 0;
    background: url("../images/info/block5_h3.png")
    no-repeat center / contain;

    text-indent: -9999px;
  }
  .star {
    position: absolute;
    left: 80px;
    top: 4px;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .star::before,
  .star::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 228px;
    height: 228px;
    background: url("../images/info/star.png")
    center / contain no-repeat;
    mix-blend-mode: screen;
    transform: translate(-50%, -50%);
  }
  .star::before {
    width: 70px;
    height: 70px;
  }

  .star::after {
    opacity: .6;
  }
</style>
</head>
<body>
  <div class="info">
    <div class="content-5 content_area content_special-block">
      <div class="title-wrap">
        <div class="text">
          <h3>發光奇蹟再翻倍倍倍</h3>
        </div>
        <span class="star"></span>
      </div>
      
    </div>
  </div>
</body>
</html>
